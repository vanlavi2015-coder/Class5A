name: LAVI tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/multi-teacher-classes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run integration tests
        run: npm test
