name: LAVI 2.0 sandbox tests

on:
  push:
    branches: [lavi-2.0-sandbox]
    paths:
      - "lavi2/**"
      - ".github/workflows/lavi2-sandbox.yml"
  pull_request:
    paths:
      - "lavi2/**"
      - ".github/workflows/lavi2-sandbox.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lavi2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lavi2/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
